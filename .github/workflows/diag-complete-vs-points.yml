name: Diag complete-pairs vs points

on:
  workflow_dispatch:

concurrency:
  group: diag-complete-vs-points
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client
        run: sudo apt-get update -y && sudo apt-get install -y openssh-client
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Build analysis script
        run: |
          cat > /tmp/analyse.py <<'PY'
          import sqlite3, json, datetime, sys

          db = sqlite3.connect('file:/tmp/data-ro.db?mode=ro', uri=True)
          db.row_factory = sqlite3.Row
          db.execute('PRAGMA query_only=ON')

          lo = int(datetime.datetime(2026, 9, 6, 2, 0, tzinfo=datetime.timezone.utc).timestamp() * 1000)
          hi = int(datetime.datetime(2026, 9, 6, 4, 0, tzinfo=datetime.timezone.utc).timestamp() * 1000)

          cand = db.execute(
              "SELECT id, fixture_source, kickoff_utc, status, titan_id, pinnacle_match_id "
              "FROM matches WHERE fixture_source IN ('hkjc','pinnacle') AND inplay=0 "
              "AND kickoff_utc>? AND kickoff_utc<=?",
              (lo, hi + 30 * 60_000),
          ).fetchall()

          engine_complete = {}
          for m in cand:
              rows = db.execute(
                  "SELECT stage, market FROM research_timeline_snapshots "
                  "WHERE match_id=? AND provider='pinnacle' AND market IN ('AH','OU') "
                  "AND stage IN ('T30','T15','T5') "
                  "GROUP BY stage, market, line_key "
                  "HAVING COUNT(DISTINCT selection)>=2",
                  (m['id'],),
              ).fetchall()
              engine_complete[m['id']] = set(f"{r['stage']}:{r['market']}" for r in rows)

          dash_captured = {}
          for m in cand:
              rows = db.execute(
                  "SELECT stage, status FROM research_timeline_points "
                  "WHERE match_id=? AND stage IN ('T30','T15','T5')",
                  (m['id'],),
              ).fetchall()
              dash_captured[m['id']] = {r['stage']: r['status'] for r in rows}

          divergence = []
          for m in cand:
              eng = engine_complete[m['id']]
              dash = dash_captured[m['id']]
              for stage in ('T30', 'T15', 'T5'):
                  eng_done = (f'{stage}:AH' in eng) and (f'{stage}:OU' in eng)
                  dash_status = dash.get(stage, '(no row)')
                  if eng_done and dash_status != 'captured':
                      divergence.append({
                          'match_id': m['id'],
                          'stage': stage,
                          'dashboard_points_status': dash_status,
                      })

          snap_counts = db.execute(
              "SELECT s.stage, s.provider, COUNT(DISTINCT s.match_id) matches, COUNT(*) rows "
              "FROM research_timeline_snapshots s JOIN matches m ON m.id=s.match_id "
              "WHERE m.kickoff_utc>? AND m.kickoff_utc<=? "
              "AND s.stage IN ('T30','T15','T5') "
              "GROUP BY s.stage, s.provider ORDER BY s.stage, s.provider",
              (lo, hi + 30 * 60_000),
          ).fetchall()

          now = int(datetime.datetime.now(datetime.timezone.utc).timestamp() * 1000)
          latest = db.execute(
              "SELECT stage, provider, COUNT(*) inserts, MAX(captured_at) last_ms "
              "FROM research_timeline_snapshots "
              "WHERE captured_at > ? AND stage IN ('T30','T15','T5') "
              "GROUP BY stage, provider ORDER BY stage, provider",
              (now - 6 * 3600 * 1000,),
          ).fetchall()

          out = {
              'window_hkt': '2026-09-06 10:00-12:00',
              'candidates_in_window': len(cand),
              'by_fixture_source': {},
              'engine_complete_all_three_stages': 0,
              'dashboard_captured_all_three_stages': 0,
              'divergence_count': len(divergence),
              'divergence_sample': divergence[:20],
              'points_status_breakdown': {},
              'snapshot_counts_in_window': [dict(r) for r in snap_counts],
              'milestone_inserts_last_6h': [
                  {'stage': r['stage'], 'provider': r['provider'], 'inserts': r['inserts'],
                   'last_hkt': datetime.datetime.fromtimestamp(r['last_ms']/1000, datetime.timezone(datetime.timedelta(hours=8))).strftime('%Y-%m-%d %H:%M:%S')}
                  for r in latest
              ],
          }
          by_src = {}
          for m in cand:
              by_src[m['fixture_source']] = by_src.get(m['fixture_source'], 0) + 1
          out['by_fixture_source'] = by_src

          for m in cand:
              eng = engine_complete[m['id']]
              if all((f'{s}:AH' in eng) and (f'{s}:OU' in eng) for s in ('T30','T15','T5')):
                  out['engine_complete_all_three_stages'] += 1
              if all(dash_captured[m['id']].get(s) == 'captured' for s in ('T30','T15','T5')):
                  out['dashboard_captured_all_three_stages'] += 1

          for stage in ('T30','T15','T5'):
              out['points_status_breakdown'][stage] = {
                  status: sum(1 for m in cand if dash_captured[m['id']].get(stage) == status)
                  for status in ('captured', 'partial', 'pending', '(no row)')
              }

          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY
          base64 -w0 /tmp/analyse.py > /tmp/analyse.b64
          wc -c /tmp/analyse.b64
      - name: Run on droplet (no DB exfil)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          B64=$(cat /tmp/analyse.b64)
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo cp /opt/odds-radar/data/data.db /tmp/data-ro.db && sudo chmod 644 /tmp/data-ro.db && echo $B64 | base64 -d > /tmp/analyse.py && python3 /tmp/analyse.py && rm -f /tmp/data-ro.db /tmp/analyse.py"
          echo "exit=$?"
