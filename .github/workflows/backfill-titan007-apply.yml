name: Titan007 回填 - 套用（會寫入生產資料庫）

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "backfill SQL 檔案路徑（相對 repo 根目錄）"
        required: true
        default: "scripts/titan007_backfill/runs/backfill_2026_08_30.sql"
      confirm:
        description: "打字確認：輸入 APPLY 先會真正寫入生產資料庫"
        required: true
        default: ""

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 檢查打字確認
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "APPLY" ]; then
            echo "confirm 輸入唔係 APPLY，中止，唔會寫入任何嘢。"
            exit 1
          fi

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 上傳 SQL
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp "${{ github.event.inputs.sql_file }}" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/titan007_backfill_apply.sql"

      - name: 套用前 sha256 + 備份
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            DB=/opt/odds-radar/data/data.db
            echo "== sha256 (before) =="
            sha256sum "$DB"
            cp "$DB" "/opt/odds-radar/data/data.db.bak.$(date +%Y%m%d%H%M%S)"
            echo "== backup created =="
            ls -la /opt/odds-radar/data/*.bak.* | tail -5
          '

      - name: 套用 SQL（單一交易、busy_timeout，唔停容器）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            DB=/opt/odds-radar/data/data.db
            sqlite3 "$DB" < /tmp/titan007_backfill_apply.sql
            echo "SQL applied"
          '

      - name: 套用後 sha256 + 列數
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            DB=/opt/odds-radar/data/data.db
            echo "== sha256 (after) =="
            sha256sum "$DB"
            echo "== results row count (all) =="
            sqlite3 "$DB" "select count(*) from results;"
            echo "== research_timeline_snapshots row count (all, source_name=titan007) =="
            sqlite3 "$DB" "select count(*) from research_timeline_snapshots where source_name='"'"'titan007'"'"';"
            echo "== docker compose still healthy =="
            cd /opt/odds-radar && docker compose ps
          '

      - name: 清理暫存檔
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'rm -f /tmp/titan007_backfill_apply.sql' || true
