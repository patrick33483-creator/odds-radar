name: 診斷降級狀態

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 讀 provider_health 同 recent errors
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo "===== provider_health ====="
          sudo docker compose -f /opt/odds-radar/compose.yaml exec -T radar node -e "
            const Database = require('better-sqlite3');
            const db = new Database('/app/data/data.db', { readonly: true });
            const rows = db.prepare('SELECT * FROM provider_health').all();
            console.log(JSON.stringify(rows, null, 2));
          "
          echo ""
          echo "===== container health ====="
          sudo docker compose -f /opt/odds-radar/compose.yaml ps
          echo ""
          echo "===== recent radar container logs (last 100 lines) ====="
          sudo docker compose -f /opt/odds-radar/compose.yaml logs --tail 100 radar 2>&1 | tail -100
          REMOTE
