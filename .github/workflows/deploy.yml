name: Deploy odds radar

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: odds-radar-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd /opt/odds-radar
             sudo install -d -m 700 /opt/odds-radar/backups
             BACKUP="/opt/odds-radar/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).db"
             sudo RADAR_BACKUP="$BACKUP" python3 -c "import os, sqlite3; source=sqlite3.connect(\"file:/opt/odds-radar/data/data.db?mode=ro\", uri=True); target=sqlite3.connect(os.environ[\"RADAR_BACKUP\"]); source.backup(target); target.close(); source.close()"
             sudo test -s "$BACKUP"
             sudo sh -c "ls -1t /opt/odds-radar/backups/pre-deploy-*.db 2>/dev/null | tail -n +8 | xargs -r rm -f"
             git fetch origin master
             git reset --hard origin/master
             timeout 300s sudo docker compose --env-file /opt/odds-radar/.env -f /opt/odds-radar/compose.yaml up -d --build
             sudo docker image prune -f'
      - name: Production health gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'sleep 50 && sudo /opt/odds-radar/deploy/health-check.sh'
