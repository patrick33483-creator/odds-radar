name: Deploy odds radar

on:
  push:
    branches: [master]
    paths-ignore:
      - ".github/workflows/**"
      - "reports/**"
      - "scripts/audit-ou-missed.ts"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: odds-radar-production
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Pull and restart
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd /opt/odds-radar
             sudo install -d -m 700 /opt/odds-radar/backups
             # The first uncompressed-backup rollout failed for lack of disk
             # space, so any old-format .db here is an incomplete artifact.
             sudo rm -f /opt/odds-radar/backups/pre-deploy-*.db
             BACKUP="/opt/odds-radar/backups/pre-deploy-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
             PARTIAL="$BACKUP.partial"
             trap "sudo rm -f \"$PARTIAL\"" EXIT
             # Bound the backup step so a stuck iterdump cannot wedge the deploy.
             # If it fails or times out, existing hourly backups remain the safety net.
             if ! sudo timeout 180s env RADAR_BACKUP="$PARTIAL" python3 -c "import gzip, os, sqlite3; source=sqlite3.connect(\"file:/opt/odds-radar/data/data.db?mode=ro\", uri=True); target=gzip.open(os.environ[\"RADAR_BACKUP\"], \"wt\", encoding=\"utf-8\", compresslevel=6); target.writelines(line + \"\\n\" for line in source.iterdump()); target.close(); source.close()"; then
               echo "pre-deploy backup failed or timed out; continuing with existing hourly backups"
               sudo rm -f "$PARTIAL"
             else
               sudo test -s "$PARTIAL"
               sudo mv "$PARTIAL" "$BACKUP"
             fi
             trap - EXIT
             sudo sh -c "ls -1t /opt/odds-radar/backups/pre-deploy-*.sql.gz 2>/dev/null | tail -n +4 | xargs -r rm -f"
             git fetch origin master
             git reset --hard origin/master
             timeout 300s sudo docker compose --env-file /opt/odds-radar/.env -f /opt/odds-radar/compose.yaml up -d --build
             sudo docker image prune -f'
      - name: Production health gate
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e
             cd /opt/odds-radar
             for attempt in $(seq 1 120); do
               container_id="$(sudo docker compose ps -aq radar)"
               health="$(sudo docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$container_id")"
               [ "$health" = healthy ] && break
               sleep 5
             done
             if [ "$health" != healthy ]; then
               sudo docker compose ps >&2
               sudo docker compose logs --tail 250 radar >&2
               exit 1
             fi
             sudo /opt/odds-radar/deploy/health-check.sh'
