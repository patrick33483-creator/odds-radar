name: Radar read-only deployment diagnostic
on: {workflow_dispatch: {}}
permissions: {contents: read}
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Read build and service state
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" \
            'set -e; sudo sh -c "cd /opt/odds-radar; echo ===git===; git rev-parse HEAD; echo ===docker===; docker compose ps; echo ===processes===; ps -eo pid,ppid,etimes,stat,cmd | grep -E \"(docker|buildkit|node|npm|tsx|vite)\" | grep -v grep || true; echo ===disk===; df -h /; echo ===health===; timeout 20 curl -sS -o /dev/null -w \"%{http_code}\\n\" http://127.0.0.1:5001/healthz || true"'
