name: 診斷 radar 完整 log

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: dump container + log
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo docker compose -f /opt/odds-radar/compose.yaml ps' || true
          echo "==== end ps ===="
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo docker compose -f /opt/odds-radar/compose.yaml logs --tail 400 radar 2>&1 | grep -iE "hourly_prewarm|pinnacle_error|refresh_failed|refresh_started|pinnapi|titan_fixtures|refreshpinnacle|hkjc_refresh" | tail -80' || true
          echo "==== end log grep ===="
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo docker compose -f /opt/odds-radar/compose.yaml logs --tail 200 radar 2>&1 | tail -100' || true
          echo "==== end log tail ===="
