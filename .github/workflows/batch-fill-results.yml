name: 批量填賽果

on:
  workflow_dispatch:
    inputs:
      tsv_path:
        description: repo 內 TSV 路徑 (home\taway\thome_score\taway_score\tdate_hkt)
        required: false
        default: "fills/batch.tsv"

jobs:
  fill:
    runs-on: ubuntu-24.04
    steps:
      - name: 已停用不安全隊名模糊填分
        run: |
          echo "此 workflow 已停用：禁止用隊名 LIKE、頭三字或同日批量配對寫入賽果。"
          echo "賽果必須由 production collector 以 Titan007 sId 精確核實。"
          exit 1
