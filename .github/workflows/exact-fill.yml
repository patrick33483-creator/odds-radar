name: exact-fill
on:
  workflow_dispatch:
    inputs:
      tsv_path:
        description: "TSV path"
        required: true
        default: "fills/exact.tsv"
jobs:
  f:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TSV: ${{ inputs.tsv_path }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp "$TSV" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/exact.tsv"
          cat > /tmp/e.py <<'PYEOF'
          import sqlite3, datetime, time
          # inline simp->trad table
          _MAP = {"诺":"諾","贝":"貝","尔":"爾","罗":"羅","纳":"納","车":"車","头":"頭","鲁":"魯","亚":"亞","陆":"陸","军":"軍","队":"隊","达":"達","电":"電","鲜":"鮮","费":"費","伦":"倫","维":"維","萨":"薩","体":"體","圣":"聖","宾":"賓","莱":"萊","马":"馬","乌":"烏","泽":"澤","兹":"茲","兰":"蘭","波":"波","泰":"泰","奥":"奧","塔":"塔","堡":"堡","青":"青","及":"及","信":"信","朗":"朗","越":"越","南":"南","加":"加","勒":"勒","斯":"斯","特":"特","快":"快","速":"速","蒙":"蒙","格":"格","多":"多","察":"察","索":"索","菲":"菲","中":"中","央":"央","保":"保","文":"文","雅":"雅","洛":"洛","朝":"朝","伊":"伊","巴":"巴","吉":"吉","里":"里","茨":"茨","辛":"辛","迪":"迪","哥":"哥","卡":"卡","穆":"穆","罕":"罕","普":"普","育":"育","彼":"彼","德":"德","年":"年","喀":"喀","山":"山","切":"切","尼":"尼","什":"什","瓦":"瓦","布":"布","利":"利","沃":"沃","蒂":"蒂","米":"米","红":"紅","篮":"籃","塞":"塞","让":"讓","东":"東","国":"國","会":"會","专":"專","车":"車"}
          def to_trad(s):
              return "".join(_MAP.get(c, c) for c in s)
          hkt = datetime.timezone(datetime.timedelta(hours=8))
          db = sqlite3.connect("/opt/odds-radar/data/data.db", timeout=30, isolation_level=None)
          db.execute("PRAGMA busy_timeout=60000")
          db.row_factory = sqlite3.Row
          fills = []
          for ln in open("/tmp/exact.tsv"):
              p = ln.rstrip("\n").split("\t")
              if len(p) < 5: continue
              fills.append(dict(home=p[0],away=p[1],hs=int(p[2]),as_=int(p[3]),date=p[4]))
          def variants(s):
              return list({s, to_trad(s)})
          filled = 0; missed = []; matched_ids = []
          for e in fills:
              y,m,d = [int(x) for x in e["date"].split("-")]
              lo = int(datetime.datetime(y,m,d,0,0,tzinfo=hkt).timestamp()*1000)
              hi = int(datetime.datetime(y,m,d,23,59,tzinfo=hkt).timestamp()*1000)
              hs = variants(e["home"]); as_ = variants(e["away"])
              rows = []; seen = set()
              for h in hs:
                  for a in as_:
                      for r in db.execute("""
                          SELECT id, home_team, away_team, fixture_source, kickoff_utc
                            FROM matches
                           WHERE home_team=? AND away_team=?
                             AND kickoff_utc>=? AND kickoff_utc<=?
                      """,(h,a,lo,hi)).fetchall():
                          if r["id"] not in seen: seen.add(r["id"]); rows.append(r)
              tag = f"{e['home']} vs {e['away']} @ {e['date']}"
              if not rows:
                  missed.append(tag); continue
              now_ms = int(time.time()*1000)
              for r in rows:
                  for attempt in range(10):
                      try:
                          db.execute("BEGIN IMMEDIATE")
                          db.execute("""
                              INSERT INTO research_results(match_id,hkjc_id,home_score,away_score,corners_total,source,result_source,source_match_id,fetched_at)
                              VALUES(?,NULL,?,?,NULL,'user','manual',?,?)
                              ON CONFLICT(match_id) DO UPDATE SET
                                home_score=excluded.home_score,
                                away_score=excluded.away_score,
                                fetched_at=excluded.fetched_at
                          """,(r["id"],e["hs"],e["as_"],r["id"],now_ms))
                          db.execute("COMMIT")
                          filled += 1
                          matched_ids.append(f"  {tag} => [{r['fixture_source']}] {r['id']} {r['home_team']} vs {r['away_team']} = {e['hs']}-{e['as_']}")
                          break
                      except Exception as ex:
                          try: db.execute("ROLLBACK")
                          except: pass
                          if "locked" in str(ex) and attempt < 9:
                              time.sleep(2); continue
                          raise
          print(f"填咗 {filled} 條 record（{len(fills)} 場輸入，missed {len(missed)}）")
          for x in matched_ids: print(x)
          if missed:
              print("--- missed ---")
              for x in missed: print(" ", x)
          db.close()
          PYEOF
          scp /tmp/e.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/e.py"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -E python3 /tmp/e.py'
