name: Rotate dashboard password

on:
  workflow_dispatch:

concurrency:
  group: rotate-dashboard-password
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Rotate and verify dashboard password
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SITE_LOGIN_PASSWORD: ${{ secrets.SITE_LOGIN_PASSWORD }}
        run: |
          test -n "$SITE_LOGIN_PASSWORD"
          {
            printf '%s\n' 'IFS= read -r NEW_PASSWORD'
            printf '%s\n' "$SITE_LOGIN_PASSWORD"
            cat <<'REMOTE'
          set -euo pipefail
          test -n "$NEW_PASSWORD"
          cd /opt/odds-radar

          export NEW_PASSWORD
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path(".env")
          password = os.environ["NEW_PASSWORD"]
          lines = path.read_text().splitlines()
          updated = []
          replaced = False
          for line in lines:
              if line.startswith("RADAR_ACCESS_PASSWORD="):
                  updated.append(f"RADAR_ACCESS_PASSWORD={password}")
                  replaced = True
              else:
                  updated.append(line)
          if not replaced:
              updated.append(f"RADAR_ACCESS_PASSWORD={password}")
          temporary = path.with_suffix(".env.tmp")
          temporary.write_text("\n".join(updated) + "\n")
          temporary.chmod(0o600)
          temporary.replace(path)
          PY
          unset NEW_PASSWORD

          docker compose up -d --force-recreate radar
          timeout 90 bash -c \
            'until [ "$(docker inspect --format "{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}" "$(docker compose ps -q radar)")" = healthy ]; do sleep 3; done'

          set -a
          . ./.env
          set +a
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            http://127.0.0.1:5001/api/status)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --user "$RADAR_ACCESS_USER:$RADAR_ACCESS_PASSWORD" \
            http://127.0.0.1:5001/api/status)" = 200
          sudo /opt/odds-radar/deploy/health-check.sh
          echo "Odds Radar authentication verified"
          REMOTE
          } | ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s'
