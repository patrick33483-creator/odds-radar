name: list-projects
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -u
          echo "=== HOST ==="
          date -Is
          hostname
          df -h /
          echo "=== ACTIVE SERVICES ==="
          systemctl list-units --type=service --state=running --no-legend --no-pager
          echo "=== INSTALLED FOOTBALL SERVICES ==="
          systemctl list-unit-files --type=service --no-legend --no-pager |
            grep -Ei 'footbreak|crown|odds|titan|pinnacle|hkjc|radar|signal|m1m6|stage' || true
          echo "=== ACTIVE TIMERS ==="
          systemctl list-timers --all --no-legend --no-pager
          echo "=== INSTALLED FOOTBALL TIMERS ==="
          systemctl list-unit-files --type=timer --no-legend --no-pager |
            grep -Ei 'footbreak|crown|odds|titan|pinnacle|hkjc|radar|signal|m1m6|stage' || true
          echo "=== DOCKER CONTAINERS ==="
          docker ps -a --no-trunc --format '{{json .}}' || true
          echo "=== DOCKER RESTART POLICIES ==="
          for id in $(docker ps -aq 2>/dev/null); do
            docker inspect --format '{{.Name}} restart={{.HostConfig.RestartPolicy.Name}} status={{.State.Status}} mounts={{range .Mounts}}{{.Source}}:{{.Destination}};{{end}}' "$id"
          done
          echo "=== COMPOSE PROJECTS ==="
          docker compose ls -a || true
          echo "=== CRON ==="
          for f in /etc/crontab /etc/cron.d/*; do
            [ -f "$f" ] || continue
            echo "--- $f"
            sed -n '1,220p' "$f"
          done
          echo "=== USER CRON ==="
          for u in root deploy ubuntu; do
            echo "--- $u"
            crontab -u "$u" -l 2>/dev/null || true
          done
          echo "=== NGINX ENABLED ==="
          find /etc/nginx/sites-enabled -maxdepth 1 -type l -printf '%f -> %l\n' 2>/dev/null || true
          echo "=== NGINX ROUTES ==="
          grep -RInE 'listen |server_name|location |proxy_pass|alias |root ' /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
          echo "=== FOOTBALL DATA PRESENCE ==="
          for p in /var/lib/footbreak /var/lib/crown-m1m6 /var/lib/crownsystem-v4 /opt/footbreak /opt/odds-radar /opt/crown-radar /opt/crown-m1m6 /opt/crownsystem-v3 /opt/crownsystem-v4; do
            [ -e "$p" ] || continue
            du -sh "$p" 2>/dev/null || true
          done
          echo "=== RECENT FOOTBALL WRITES ==="
          find /var/lib/footbreak /var/lib/crown-m1m6 /var/lib/crownsystem-v4 /opt/odds-radar /opt/crown-radar \
            -xdev -type f -mmin -180 -printf '%TY-%Tm-%TdT%TH:%TM:%TS %s %p\n' 2>/dev/null |
            sort | tail -200 || true
          REMOTE
