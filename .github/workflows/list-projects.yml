name: list-projects
on: workflow_dispatch
jobs:
  shutdown:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop football workloads and preserve data
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
          set -u
          failures=0
          football_re='crown|footbreak|stage-engine|hkjc-result|live-titan|odds-mobile|pinnacle-mobile|titan-crow|ogb-fires|u1-fires|v2-results|strategy-merged|direction-path'
          racing_api_before="$(systemctl is-active racing-radar-api.service 2>/dev/null || true)"
          racing_scheduler_before="$(systemctl is-active racing-radar-scheduler.service 2>/dev/null || true)"

          echo "=== STOP AND DISABLE FOOTBALL TIMERS ==="
          mapfile -t timers < <(
            systemctl list-unit-files --type=timer --no-legend --no-pager |
              awk '{print $1}' | grep -Ei "$football_re" | grep -Eiv '^racing-' | sort -u
          )
          services=()
          for timer in "${timers[@]}"; do
            service="$(systemctl show "$timer" -p Unit --value 2>/dev/null || true)"
            [ -n "$service" ] && services+=("$service")
            echo "disable --now $timer"
            timeout 20s systemctl disable --now "$timer" || {
              systemctl disable "$timer" 2>/dev/null || true
              systemctl stop "$timer" 2>/dev/null || true
            }
          done

          echo "=== STOP TIMER SERVICES AND FOOTBALL APIS ==="
          services+=(
            crown-dashboard-api.service
            crown-strategy-refresh-api.service
            footbreak-dashboard-api.service
          )
          mapfile -t services < <(printf '%s\n' "${services[@]}" | sed '/^$/d' | sort -u)
          for service in "${services[@]}"; do
            echo "disable/stop $service"
            systemctl disable "$service" 2>/dev/null || true
            timeout 20s systemctl stop "$service" || {
              systemctl kill --kill-who=all --signal=SIGKILL "$service" 2>/dev/null || true
              systemctl reset-failed "$service" 2>/dev/null || true
            }
          done

          echo "=== DISABLE CROWN RADAR CRON ==="
          for cronfile in /etc/cron.d/crown-radar /etc/cron.d/crown-radar-v2; do
            if [ -f "$cronfile" ]; then
              mv "$cronfile" "${cronfile}.disabled"
              echo "disabled $cronfile"
            fi
          done

          echo "=== FREE MINIMUM SPACE USING APPROVED TEMP CLEANUP ==="
          timeout 180s systemctl start crown-browser-tmp-cleanup.service 2>/dev/null || true
          timeout 20s systemctl stop crown-browser-tmp-cleanup.service 2>/dev/null || true
          df -h /

          echo "=== STOP FOOTBALL DOCKER CONTAINERS ==="
          for id in $(docker ps -aq 2>/dev/null); do
            details="$(docker inspect --format '{{.Name}} {{range .Mounts}}{{.Source}} {{end}} {{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id" 2>/dev/null || true)"
            if printf '%s\n' "$details" | grep -Eq '/opt/(odds-radar|crown-radar)'; then
              echo "stop $details"
              docker update --restart=no "$id" || true
              timeout 25s docker stop -t 15 "$id" || docker kill "$id" || failures=$((failures + 1))
            fi
          done
          echo "=== STOP DOCKER DAEMON (INVENTORY CONFIRMED FOOTBALL-ONLY) ==="
          systemctl disable docker.service docker.socket 2>/dev/null || true
          timeout 45s systemctl stop docker.service docker.socket || {
            systemctl kill --kill-who=all --signal=SIGKILL docker.service 2>/dev/null || true
            systemctl stop docker.socket 2>/dev/null || true
          }

          echo "=== DISABLE FOOTBALL NGINX SITES ==="
          rm -f /etc/nginx/sites-enabled/crown /etc/nginx/sites-enabled/footbreak
          if [ -L /etc/nginx/sites-enabled/unified-dashboard ] &&
             [ ! -s /etc/nginx/sites-enabled/unified-dashboard ]; then
            rm -f /etc/nginx/sites-enabled/unified-dashboard
          fi
          nginx -t || failures=$((failures + 1))
          systemctl reload nginx || failures=$((failures + 1))

          echo "=== VERIFY FOOTBALL TIMERS ==="
          for timer in "${timers[@]}"; do
            state="$(systemctl is-active "$timer" 2>/dev/null || true)"
            enabled="$(systemctl is-enabled "$timer" 2>/dev/null || true)"
            echo "$timer active=$state enabled=$enabled"
            [ "$state" = inactive ] || [ "$state" = failed ] || failures=$((failures + 1))
            [ "$enabled" = disabled ] || [ "$enabled" = static ] || failures=$((failures + 1))
          done

          echo "=== VERIFY FOOTBALL SERVICES ==="
          active_services="$(
            systemctl list-units --type=service --state=running --no-legend --no-pager |
              grep -Ei "$football_re" | grep -Eiv 'racing-' || true
          )"
          printf '%s\n' "$active_services"
          [ -z "$active_services" ] || failures=$((failures + 1))
          for service in crown-dashboard-api.service crown-strategy-refresh-api.service footbreak-dashboard-api.service; do
            state="$(systemctl is-active "$service" 2>/dev/null || true)"
            echo "$service=$state"
            [ "$state" = inactive ] || [ "$state" = failed ] || failures=$((failures + 1))
          done

          echo "=== VERIFY FOOTBALL CONTAINERS ==="
          running_football_containers=""
          docker_state="$(systemctl is-active docker.service 2>/dev/null || true)"
          docker_enabled="$(systemctl is-enabled docker.service 2>/dev/null || true)"
          echo "docker.service active=$docker_state enabled=$docker_enabled"
          [ "$docker_state" = inactive ] || [ "$docker_state" = failed ] || failures=$((failures + 1))
          [ "$docker_enabled" = disabled ] || failures=$((failures + 1))
          if [ "$docker_state" = active ]; then
            for id in $(docker ps -q 2>/dev/null); do
              details="$(docker inspect --format '{{.Name}} {{range .Mounts}}{{.Source}} {{end}} {{index .Config.Labels "com.docker.compose.project.working_dir"}}' "$id" 2>/dev/null || true)"
              if printf '%s\n' "$details" | grep -Eq '/opt/(odds-radar|crown-radar)'; then
                running_football_containers="${running_football_containers}${details}\n"
              fi
            done
          fi
          printf '%b' "$running_football_containers"
          [ -z "$running_football_containers" ] || failures=$((failures + 1))

          echo "=== VERIFY WEB PORTS ==="
          ss -lntp | grep -E ':(5001|5002|8081|8082|8765|8766|8786)\b' && failures=$((failures + 1)) || true

          echo "=== VERIFY RACING PRESERVED ==="
          racing_api="$(systemctl is-active racing-radar-api.service 2>/dev/null || true)"
          racing_scheduler="$(systemctl is-active racing-radar-scheduler.service 2>/dev/null || true)"
          echo "racing-radar-api before=$racing_api_before after=$racing_api"
          echo "racing-radar-scheduler before=$racing_scheduler_before after=$racing_scheduler"
          [ "$racing_api" = "$racing_api_before" ] || failures=$((failures + 1))
          [ "$racing_scheduler" = "$racing_scheduler_before" ] || failures=$((failures + 1))
          if [ "$racing_api_before" = active ]; then
            ss -lntp | grep -E ':8083\b' || failures=$((failures + 1))
          fi

          echo "=== VERIFY DATA PRESERVED ==="
          for p in \
            /var/lib/footbreak /var/lib/crown-m1m6 /var/lib/crownsystem-v4 \
            /opt/footbreak /opt/odds-radar/data /opt/odds-radar/backups \
            /opt/crown-radar-v2/data; do
            if [ -e "$p" ]; then
              du -sh "$p" 2>/dev/null || true
            else
              echo "MISSING $p"
              failures=$((failures + 1))
            fi
          done

          echo "=== RESULT ==="
          echo "failures=$failures"
          test "$failures" -eq 0
          REMOTE
