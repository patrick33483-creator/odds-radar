name: Audit Pinnacle production health (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Read Pinnacle and scan state without modifying production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/odds-radar
          commit="$(git rev-parse HEAD)"
          container_id="$(sudo docker compose ps -aq radar)"
          health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
          log_lines="$(sudo docker compose logs --tail 900 radar 2>&1 || true)"
          COMMIT="$commit" HEALTH="$health" LOG_LINES="$log_lines" python3 - <<'PY'
          import json
          import os
          import re
          import sqlite3

          db = sqlite3.connect('file:/opt/odds-radar/data/data.db?mode=ro', uri=True, timeout=1)
          db.execute('PRAGMA query_only=ON')
          db.execute('PRAGMA busy_timeout=1000')
          scalar = lambda sql, params=(): db.execute(sql, params).fetchone()[0]
          states = dict(db.execute("SELECT key,value FROM app_state WHERE key IN ('lastScan','researchResultsLastRunAt','researchOpeningsLastRunAt','crownBackfillLastRunAt','crownBackfillLastSuccessAt','crownBackfillLastError')").fetchall())
          provider_health = db.execute("SELECT provider,ok,last_success_at,last_attempt_at,last_error_at,last_error,consecutive_failures,item_count,mode FROM provider_health WHERE provider IN ('hkjc','pinnacle') ORDER BY provider").fetchall()
          quote_latest = db.execute("SELECT provider,COUNT(*) rows,MAX(fetched_at) max_fetched_at,MIN(fetched_at) min_fetched_at FROM odds_latest WHERE provider IN ('hkjc','pinnacle','crown') GROUP BY provider ORDER BY provider").fetchall()
          pinnacle_latest_max = scalar("SELECT MAX(fetched_at) FROM odds_latest WHERE provider='pinnacle'")
          pinnacle_latest_rows = scalar("SELECT COUNT(*) FROM odds_latest WHERE provider='pinnacle'")
          hkjc_latest_max = scalar("SELECT MAX(fetched_at) FROM odds_latest WHERE provider='hkjc'")
          db.close()
          interesting = []
          for line in os.environ.get('LOG_LINES','').splitlines():
              if any(token in line for token in ('pinnapi_fixtures_error','pinnacle_detail_error','pinnacle_detail_scan','auto_research_timeline','auto_window_scan','window_scan','crown_research_detail_error','today_crown_backfill')):
                  interesting.append(re.sub(r'\x1b\[[0-9;]*m', '', line))
          print(json.dumps({
              'read_only_connection': True,
              'production_commit': os.environ['COMMIT'],
              'radar_health': os.environ['HEALTH'],
              'odds_latest_by_provider': [dict(zip(('provider','rows','max_fetched_at','min_fetched_at'), row)) for row in quote_latest],
              'pinnacle_odds_latest_max_fetched_at': pinnacle_latest_max,
              'pinnacle_odds_latest_rows': pinnacle_latest_rows,
              'hkjc_odds_latest_max_fetched_at': hkjc_latest_max,
              'provider_health': [dict(zip(('provider','ok','last_success_at','last_attempt_at','last_error_at','last_error','consecutive_failures','item_count','mode'), row)) for row in provider_health],
              'app_state': states,
              'interesting_container_log_lines_last_900': interesting[-80:],
          }, ensure_ascii=False, sort_keys=True))
          PY
          REMOTE
