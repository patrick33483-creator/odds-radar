name: Audit Pinnacle production health (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Read Pinnacle and scan state without modifying production
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/odds-radar
          commit="$(git rev-parse HEAD)"
          container_id="$(sudo docker compose ps -aq radar)"
          health="$(sudo docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$container_id")"
          radar_settings="$(sudo docker inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$container_id" | grep -E '^RADAR_(AUTO_SCAN|SIM_TARGET|SCAN_WINDOW_MIN|SCAN_INTERVAL_SEC|TODAY_CROWN_BACKFILL)=' || true)"
          COMMIT="$commit" HEALTH="$health" RADAR_SETTINGS="$radar_settings" python3 - <<'PY'
          import json
          import os
          import re
          import sqlite3
          import subprocess

          db = sqlite3.connect('file:/opt/odds-radar/data/data.db?mode=ro', uri=True, timeout=1)
          db.execute('PRAGMA query_only=ON')
          db.execute('PRAGMA busy_timeout=1000')
          scalar = lambda sql, params=(): db.execute(sql, params).fetchone()[0]
          states = dict(db.execute("SELECT key,value FROM app_state WHERE key IN ('researchResultsLastRunAt','researchOpeningsLastRunAt','crownBackfillLastRunAt','crownBackfillLastSuccessAt','crownBackfillLastError')").fetchall())
          provider_health = db.execute("SELECT provider,ok,last_success_at,last_attempt_at,last_error_at,last_error,consecutive_failures,item_count,mode FROM provider_health WHERE provider IN ('hkjc','pinnacle') ORDER BY provider").fetchall()
          quote_latest = db.execute("SELECT provider,COUNT(*) rows,MAX(fetched_at) max_fetched_at,MIN(fetched_at) min_fetched_at FROM odds_latest WHERE provider IN ('hkjc','pinnacle','crown') GROUP BY provider ORDER BY provider").fetchall()
          pinnacle_latest_max = scalar("SELECT MAX(fetched_at) FROM odds_latest WHERE provider='pinnacle'")
          pinnacle_latest_rows = scalar("SELECT COUNT(*) FROM odds_latest WHERE provider='pinnacle'")
          hkjc_latest_max = scalar("SELECT MAX(fetched_at) FROM odds_latest WHERE provider='hkjc'")
          simulation_bets = scalar("SELECT COUNT(*) FROM simulation_bets WHERE excluded_from_stats=0")
          fixture_sources = db.execute("SELECT fixture_source,COUNT(*) FROM matches GROUP BY fixture_source ORDER BY fixture_source").fetchall()
          pinnacle_only_matches = scalar("SELECT COUNT(*) FROM matches WHERE fixture_source='pinnacle'")
          pinnacle_only_kickoff_window = scalar("SELECT COUNT(*) FROM matches WHERE fixture_source='pinnacle' AND kickoff_utc > strftime('%s','now')*1000")
          pinnapi_source_map_total = scalar("SELECT COUNT(*) FROM pinnacle_source_map WHERE pinnapi_id IS NOT NULL")
          matches_create_sql = scalar("SELECT sql FROM sqlite_master WHERE type='table' AND name='matches'")
          translation_table_exists = scalar("SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='pinnacle_translations'")
          translation_rows = scalar("SELECT COUNT(*) FROM pinnacle_translations") if translation_table_exists else 0
          translation_zh_home_rows = scalar("SELECT COUNT(*) FROM pinnacle_translations WHERE zh_home IS NOT NULL AND trim(zh_home)<>''") if translation_table_exists else 0
          translation_samples = db.execute(
              "SELECT m.home_team,m.away_team,m.league,pt.zh_home,pt.zh_away,pt.zh_league,pt.source "
              "FROM pinnacle_translations pt JOIN matches m ON m.id='pinnacle:'||pt.pinnapi_id "
              "WHERE pt.zh_home IS NOT NULL AND trim(pt.zh_home)<>'' ORDER BY random() LIMIT 3"
          ).fetchall() if translation_table_exists else []
          # Estimate how much of the live Pinnacle-only card can be translated
          # through the already-learned HKJC↔Pinnacle alias graph.
          import unicodedata
          def norm_name(v):
              return ''.join(ch.lower() for ch in unicodedata.normalize('NFKC', v or '') if ch.isalnum())
          alias_rows = db.execute("SELECT canonical,alias,provider FROM team_aliases").fetchall()
          pinnacle_to_canonical = {norm_name(alias): canonical for canonical,alias,provider in alias_rows if provider == 'pinnacle'}
          canonical_to_zh = {}
          for canonical,alias,provider in alias_rows:
              if provider == 'hkjc' and re.search(r'[\u3400-\u9fff]', alias or ''):
                  canonical_to_zh.setdefault(canonical, alias)
          po_rows = db.execute("SELECT id,home_team,away_team,league FROM matches WHERE fixture_source='pinnacle'").fetchall()
          alias_translatable = []
          for mid,home,away,league in po_rows:
              zh_home = canonical_to_zh.get(pinnacle_to_canonical.get(norm_name(home), ''))
              zh_away = canonical_to_zh.get(pinnacle_to_canonical.get(norm_name(away), ''))
              if zh_home or zh_away:
                  alias_translatable.append((mid,home,away,league,zh_home,zh_away))
          pinnacle_only_snapshots = db.execute(
              "SELECT stage, COUNT(*) FROM research_timeline_snapshots s JOIN matches m ON m.id=s.match_id "
              "WHERE m.fixture_source='pinnacle' AND s.provider='pinnacle' GROUP BY stage ORDER BY stage"
          ).fetchall()
          timeline_by_stage = db.execute(
              "SELECT provider,stage,COUNT(*),MAX(captured_at) FROM research_timeline_snapshots "
              "WHERE provider IN ('hkjc','pinnacle') GROUP BY provider,stage ORDER BY provider,stage"
          ).fetchall()
          ou_counts = db.execute(
              "SELECT 'prealerts' kind,COUNT(*) total,MAX(detected_at) latest_detected_at FROM ou_signal_prealerts "
              "UNION ALL SELECT 'observations',COUNT(*),MAX(detected_at) FROM ou_signal_observations"
          ).fetchall()
          logs = subprocess.run(
              ['sudo','docker','compose','logs','--tail','900','radar'], capture_output=True, text=True, check=False,
          ).stdout
          clean_logs = [re.sub(r'\x1b\[[0-9;]*m', '', line) for line in logs.splitlines()]
          crown_events = [line for line in clean_logs if 'today_crown_backfill' in line or 'crown_research_detail' in line]
          pinnacle_only_logs = [line for line in clean_logs if 'pinnacle_only' in line]
          auto_research = [line for line in clean_logs if 'auto_research_timeline' in line]
          auto_window = [line for line in clean_logs if 'auto_window_scan' in line]
          ou_errors = [line for line in clean_logs if 'ou_signal' in line.lower() and 'error' in line.lower()]
          print("::notice title=Phase1 read-only production audit::" + json.dumps({
              'read_only_connection': True,
              'production_commit': os.environ['COMMIT'],
              'radar_health': os.environ['HEALTH'],
              'odds_latest_by_provider': [dict(zip(('provider','rows','max_fetched_at','min_fetched_at'), row)) for row in quote_latest],
              'pinnacle_odds_latest_max_fetched_at': pinnacle_latest_max,
              'pinnacle_odds_latest_rows': pinnacle_latest_rows,
              'hkjc_odds_latest_max_fetched_at': hkjc_latest_max,
              'provider_health': [dict(zip(('provider','ok','last_success_at','last_attempt_at','last_error_at','last_error','consecutive_failures','item_count','mode'), row)) for row in provider_health],
              'research_timeline_by_provider_stage': [dict(zip(('provider','stage','rows','max_captured_at'), row)) for row in timeline_by_stage],
              'ou_counts': [dict(zip(('kind','total','latest_detected_at'), row)) for row in ou_counts],
              'crown_events_current_container_count': len(crown_events),
              'auto_research_timeline_current_container_count': len(auto_research),
              'auto_research_timeline_latest': auto_research[-1] if auto_research else None,
              'auto_window_scan_current_container_count': len(auto_window),
              'auto_window_scan_latest': auto_window[-1] if auto_window else None,
              'ou_errors_current_container_count': len(ou_errors),
              'ou_errors_current_container': ou_errors[-3:],
              'app_state': states,
              'fixture_sources': [dict(zip(('fixture_source','rows'), row)) for row in fixture_sources],
              'pinnacle_only_matches': pinnacle_only_matches,
              'pinnacle_only_kickoff_window': pinnacle_only_kickoff_window,
              'pinnapi_source_map_total': pinnapi_source_map_total,
              'pinnacle_only_snapshots_by_stage': [dict(zip(('stage','rows'), row)) for row in pinnacle_only_snapshots],
              'pinnacle_only_log_tail': pinnacle_only_logs[-5:],
              'matches_create_sql': matches_create_sql,
              'pinnacle_translation_table_exists': bool(translation_table_exists),
              'pinnacle_translation_rows': translation_rows,
              'pinnacle_translation_zh_home_rows': translation_zh_home_rows,
              'pinnacle_translation_samples': [dict(zip(('en_home','en_away','en_league','zh_home','zh_away','zh_league','source'), row)) for row in translation_samples],
              'pinnacle_alias_translatable_rows': len(alias_translatable),
              'pinnacle_alias_translatable_both_teams': sum(1 for row in alias_translatable if row[4] and row[5]),
              'pinnacle_alias_translation_samples': [dict(zip(('match_id','en_home','en_away','league','zh_home','zh_away'), row)) for row in alias_translatable[:5]],
              'simulation_bets_included': simulation_bets,
              'radar_settings': os.environ.get('RADAR_SETTINGS', '').splitlines(),
          }, ensure_ascii=False, sort_keys=False))
          db.close()
          PY
          printf '%s\n' '=== relevant radar logs (last 900) ==='
          sudo docker compose logs --tail 900 radar 2>&1 \
            | grep -Ei 'pinnapi_fixtures_error|pinnacle_detail_error|pinnacle_detail_scan|auto_research_timeline|auto_window_scan|window_scan|crown_research_detail_error|today_crown_backfill|error|failed' \
            | tail -80 || true
          REMOTE
