name: Titan007 回填 - 稽核 / 套用

on:
  workflow_dispatch:
    inputs:
      sql_file:
        description: "backfill SQL 檔案路徑（相對 repo 根目錄）"
        required: true
        default: "scripts/titan007_backfill/runs/backfill_2026_08_30.sql"
      confirm_apply:
        description: "淨係喺打 APPLY 先會真正寫入生產資料庫；留空 = 只做唯讀稽核"
        required: false
        default: ""

jobs:
  audit_or_apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 上傳 SQL 到暫存位置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp "${{ github.event.inputs.sql_file }}" "$DEPLOY_USER@$DEPLOY_HOST:/tmp/titan007_backfill.sql"

      - name: 確保 host 有 sqlite3（冪等，唔改動容器/服務）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            if ! command -v sqlite3 >/dev/null 2>&1; then
              echo "sqlite3 未安裝，安裝中..."
              sudo apt-get update -qq
              sudo apt-get install -y -qq sqlite3
            fi
            sqlite3 --version
          '

      - name: 讀取生產狀態（sha256、目標賽事列數，唔寫入任何資料）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            DB=/opt/odds-radar/data/data.db
            SQ="sudo sqlite3"
            echo "== sha256 (before) =="
            sudo sha256sum "$DB"
            echo "== matches row count =="
            $SQ "$DB" "select count(*) from matches;"
            echo "== results row count (all) =="
            $SQ "$DB" "select count(*) from results;"
            echo "== research_timeline_snapshots row count (all) =="
            $SQ "$DB" "select count(*) from research_timeline_snapshots;"
            echo "== research_timeline_points row count (all) =="
            $SQ "$DB" "select count(*) from research_timeline_points;"
            echo "== docker compose status =="
            cd /opt/odds-radar && sudo docker compose --env-file /opt/odds-radar/.env ps
          '

      - name: "語法檢查 SQL：喺遠端用暫存複本執行，唔碰生產 db"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            sudo cp /opt/odds-radar/data/data.db /tmp/titan007_syntax_check.db
            sudo sqlite3 /tmp/titan007_syntax_check.db < /tmp/titan007_backfill.sql
            echo "SQL applied cleanly against a throwaway copy - syntax OK"
            sudo rm -f /tmp/titan007_syntax_check.db
          '

      - name: 檢查是否要真正套用
        id: gate
        run: |
          if [ "${{ github.event.inputs.confirm_apply }}" = "APPLY" ]; then
            echo "do_apply=true" >> "$GITHUB_OUTPUT"
          else
            echo "do_apply=false" >> "$GITHUB_OUTPUT"
            echo "confirm_apply 冇打 APPLY，呢次淨係做咗以上唯讀稽核，冇寫入生產資料庫。"
          fi

      - name: 套用前備份（只喺 confirm_apply=APPLY 先行）
        if: steps.gate.outputs.do_apply == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            sudo cp /opt/odds-radar/data/data.db "/opt/odds-radar/data/data.db.bak.$(date +%Y%m%d%H%M%S)"
            sudo ls -la /opt/odds-radar/data/*.bak.* | tail -5
          '

      - name: 套用 SQL 落生產（單一交易、busy_timeout，唔停容器）
        if: steps.gate.outputs.do_apply == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            sudo sqlite3 /opt/odds-radar/data/data.db < /tmp/titan007_backfill.sql
            echo "SQL applied to production"
          '

      - name: 套用後 sha256 + 列數
        if: steps.gate.outputs.do_apply == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            DB=/opt/odds-radar/data/data.db
            SQ="sudo sqlite3"
            echo "== sha256 (after) =="
            sudo sha256sum "$DB"
            echo "== results row count (all) =="
            $SQ "$DB" "select count(*) from results;"
            echo "== research_timeline_snapshots row count (source_name=titan007) =="
            $SQ "$DB" "select count(*) from research_timeline_snapshots where source_name='"'"'titan007'"'"';"
            echo "== docker compose still healthy =="
            cd /opt/odds-radar && sudo docker compose --env-file /opt/odds-radar/.env ps
          '

      - name: 清理暫存檔
        if: always()
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo rm -f /tmp/titan007_backfill.sql /tmp/titan007_syntax_check.db' || true
