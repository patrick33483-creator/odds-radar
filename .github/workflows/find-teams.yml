name: find-teams
on:
  workflow_dispatch:
    inputs:
      names:
        description: "team names comma-separated"
        required: true
jobs:
  f:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          NAMES: ${{ inputs.names }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          echo "$NAMES" > /tmp/names.txt
          scp /tmp/names.txt "$DEPLOY_USER@$DEPLOY_HOST:/tmp/names.txt"
          cat > /tmp/f.py <<'PYEOF'
          import sqlite3, datetime
          db = sqlite3.connect("/opt/odds-radar/data/data.db", timeout=30)
          db.row_factory = sqlite3.Row
          hkt = datetime.timezone(datetime.timedelta(hours=8))
          raw = open("/tmp/names.txt").read()
          names = [n.strip() for n in raw.split(",") if n.strip()]
          lo = int(datetime.datetime(2026,9,3,0,0,tzinfo=hkt).timestamp()*1000)
          hi = int(datetime.datetime(2026,9,6,0,0,tzinfo=hkt).timestamp()*1000)
          for n in names:
              rows = db.execute("""
                SELECT m.id, m.fixture_source, m.home_team, m.away_team, m.kickoff_utc,
                       CASE WHEN r.match_id IS NULL THEN 'AWAITING' ELSE r.home_score||'-'||r.away_score END result
                  FROM matches m LEFT JOIN research_results r ON r.match_id=m.id
                 WHERE (m.home_team LIKE ? OR m.away_team LIKE ?)
                   AND m.kickoff_utc>=? AND m.kickoff_utc<=?
                 ORDER BY m.kickoff_utc DESC LIMIT 10
              """,(f"%{n}%",f"%{n}%",lo,hi)).fetchall()
              print(f"== {n} ==")
              for r in rows:
                  t = datetime.datetime.fromtimestamp(r['kickoff_utc']/1000, hkt).strftime('%m-%d %H:%M')
                  print(f"  [{r['fixture_source']}] {r['id']} {t} {r['home_team']} vs {r['away_team']} => {r['result']}")
              if not rows: print("  (none)")
          print("== OU_SIGNAL_PENDING_RESULTS ==")
          now_ms = int(datetime.datetime.now(datetime.timezone.utc).timestamp()*1000)
          pending = db.execute("""
            SELECT m.id, m.fixture_source, m.league, m.home_team, m.away_team,
                   m.kickoff_utc, GROUP_CONCAT(DISTINCT o.rule_id) rule_ids,
                   GROUP_CONCAT(DISTINCT o.line_key) line_keys
              FROM ou_signal_observations o
              JOIN matches m ON m.id=o.match_id
              LEFT JOIN research_results r ON r.match_id=m.id
             WHERE r.match_id IS NULL
               AND m.kickoff_utc <= ?
             GROUP BY m.id, m.fixture_source, m.league, m.home_team, m.away_team, m.kickoff_utc
             ORDER BY m.kickoff_utc
          """,(now_ms - 3*3600*1000,)).fetchall()
          print(f"TOTAL={len(pending)}")
          for r in pending:
              t = datetime.datetime.fromtimestamp(r['kickoff_utc']/1000, hkt).strftime('%Y-%m-%d %H:%M')
              print(f"  {r['id']}\t{t}\t{r['league']}\t{r['home_team']}\t{r['away_team']}\t{r['rule_ids']}\t{r['line_keys']}")
          print("== OU_SIGNAL_RULE_SUMMARIES ==")
          summaries = db.execute("""
            SELECT o.rule_id,
                   COUNT(*) observations,
                   SUM(CASE WHEN r.home_score IS NOT NULL THEN 1 ELSE 0 END) settled,
                   SUM(CASE WHEN r.home_score IS NOT NULL
                                  AND (r.home_score+r.away_score) != CAST(o.line_key AS REAL)
                            THEN 1 ELSE 0 END) decided,
                   SUM(CASE WHEN r.home_score IS NOT NULL
                                  AND (r.home_score+r.away_score) != CAST(o.line_key AS REAL)
                                  AND ((o.signal_selection='O' AND (r.home_score+r.away_score) > CAST(o.line_key AS REAL))
                                    OR (o.signal_selection='U' AND (r.home_score+r.away_score) < CAST(o.line_key AS REAL)))
                            THEN 1 ELSE 0 END) hits
              FROM ou_signal_observations o
              LEFT JOIN research_results r ON r.match_id=o.match_id
             GROUP BY o.rule_id
             ORDER BY o.rule_id
          """).fetchall()
          for r in summaries:
              rate = None if not r['decided'] else round(100*r['hits']/r['decided'], 1)
              print(f"  {r['rule_id']}\t累積={r['observations']}\t已結算={r['settled']}\t已判定={r['decided']}\t命中={r['hits']}\t命中率={rate}")
          PYEOF
          scp /tmp/f.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/f.py"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -E python3 /tmp/f.py'
