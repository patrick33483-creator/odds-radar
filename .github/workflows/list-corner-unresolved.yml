name: 匯出未補角球場次名單

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 匯出 CSV
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=40 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' > corner-unresolved.csv <<'REMOTE'
          set -euo pipefail
          cd /opt/odds-radar
          sudo docker compose exec -T radar node dist/list-corner-unresolved.cjs
          REMOTE
          echo "----"
          wc -l corner-unresolved.csv
          head -3 corner-unresolved.csv

      - name: 上傳 artifact
        uses: actions/upload-artifact@v4
        with:
          name: corner-unresolved-csv
          path: corner-unresolved.csv
          retention-days: 30
