name: 回測 0盤馬會壓價至少 0.10（只讀）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backtest-ah0-hkjc-compression
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 以 SQLite 唯讀模式匯出亞洲讓球 0 盤
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo python3 -' > radar-ah0.jsonl <<'PY'
          import json
          import sqlite3

          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          db.execute("BEGIN")
          sql = r"""
          SELECT m.id AS match_id, m.hkjc_id, m.league, m.home_team,
                 m.away_team, m.kickoff_utc,
                 q.provider, q.market, q.stage, q.line_key, q.selection,
                 q.decimal_odds, q.is_main, q.source_updated_at,
                 q.captured_at, q.target_at, q.status AS quote_status,
                 COALESCE(rr.home_score, r.home_score) AS home_score,
                 COALESCE(rr.away_score, r.away_score) AS away_score,
                 COALESCE(rr.source, r.source) AS result_source,
                 COALESCE(rr.fetched_at, r.fetched_at) AS result_fetched_at
            FROM research_timeline_snapshots q
            JOIN matches m ON m.id=q.match_id
            LEFT JOIN research_results rr ON rr.match_id=m.id
            LEFT JOIN results r ON r.match_id=m.id
           WHERE q.market='AH'
             AND ABS(CAST(q.line_key AS REAL)) < 0.000001
             AND q.captured_at < m.kickoff_utc
           ORDER BY m.kickoff_utc,m.id,q.stage,q.provider,q.selection
          """
          for row in db.execute(sql):
              print(json.dumps(dict(row), ensure_ascii=False, separators=(",", ":")))
          db.rollback()
          db.close()
          PY
          test -s radar-ah0.jsonl
          wc -l radar-ah0.jsonl

      - name: 執行離線回測
        run: |
          python3 scripts/backtest_ah0_hkjc_compression.py radar-ah0.jsonl \
            --json-output ah0-compression-report.json \
            --markdown-output ah0-compression-report.md
          cat ah0-compression-report.md
          sha256sum radar-ah0.jsonl ah0-compression-report.json \
            ah0-compression-report.md > ah0-compression.sha256

      - name: 上載回測證據
        uses: actions/upload-artifact@v4
        with:
          name: ah0-hkjc-compression-backtest
          path: |
            radar-ah0.jsonl
            ah0-compression-report.json
            ah0-compression-report.md
            ah0-compression.sha256
          retention-days: 7
          if-no-files-found: error
