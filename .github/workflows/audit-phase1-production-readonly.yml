name: R-Pin2 encrypted read-only import evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify destination and configure existing SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "146.190.93.148"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
      - name: Encrypt the read-only result directly from SSH stdout
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          test "$DEPLOY_HOST" = "146.190.93.148"
          timeout 180s ssh -o BatchMode=yes -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -n python3 -B -' \
            < audit/rpin2_release_preflight_readonly.py \
            | openssl cms -encrypt -binary -aes-256-cbc -outform DER \
                -out rpin2-import-evidence.cms audit/evidence-public-cert.pem
      - uses: actions/upload-artifact@v4
        with:
          name: rpin2-import-evidence-encrypted
          path: rpin2-import-evidence.cms
          retention-days: 1
          if-no-files-found: error
