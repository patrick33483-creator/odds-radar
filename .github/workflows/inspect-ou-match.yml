name: 查詢單場入球大細訊號狀態（只讀）

on:
  workflow_dispatch:
    inputs:
      team_query:
        description: "球隊名稱關鍵字（任何一方，用 % 模糊比對）"
        required: true

permissions:
  contents: read

concurrency:
  group: inspect-ou-match-radar
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 查詢比賽方向、賠率及規則命中狀態
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          TEAM_QUERY: ${{ github.event.inputs.team_query }}
        run: |
          umask 077
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo TEAM_QUERY='$TEAM_QUERY' python3 -" <<'PY'
          import json
          import os
          import sqlite3

          q = os.environ["TEAM_QUERY"]
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          db.execute("BEGIN")

          matches = db.execute(
              """
              SELECT id, league, home_team, away_team, kickoff_utc, status, inplay
                FROM matches
               WHERE home_team LIKE ? OR away_team LIKE ?
                  OR home_team_en LIKE ? OR away_team_en LIKE ?
               ORDER BY kickoff_utc DESC
               LIMIT 5
              """,
              (f"%{q}%", f"%{q}%", f"%{q}%", f"%{q}%"),
          ).fetchall()

          print("=== MATCHES ===")
          for m in matches:
              print(json.dumps(dict(m), ensure_ascii=False))

          for m in matches:
              mid = m["id"]
              print(f"\n=== SNAPSHOTS (OU) for {mid} ===")
              rows = db.execute(
                  """
                  SELECT provider, stage, line_key, selection, decimal_odds, is_main, captured_at
                    FROM research_timeline_snapshots
                   WHERE match_id=? AND market='OU'
                   ORDER BY provider, stage, line_key, selection
                  """,
                  (mid,),
              ).fetchall()
              for r in rows:
                  print(json.dumps(dict(r), ensure_ascii=False))

              print(f"\n=== ou_signal_prealerts for {mid} ===")
              for r in db.execute(
                  "SELECT * FROM ou_signal_prealerts WHERE match_id=?", (mid,)
              ).fetchall():
                  print(json.dumps(dict(r), ensure_ascii=False))

              print(f"\n=== ou_signal_observations for {mid} ===")
              for r in db.execute(
                  "SELECT * FROM ou_signal_observations WHERE match_id=?", (mid,)
              ).fetchall():
                  print(json.dumps(dict(r), ensure_ascii=False))

              print(f"\n=== research_results for {mid} ===")
              for r in db.execute(
                  "SELECT * FROM research_results WHERE match_id=?", (mid,)
              ).fetchall():
                  print(json.dumps(dict(r), ensure_ascii=False))

          db.rollback()
          db.close()
          PY
