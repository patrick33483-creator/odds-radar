name: 查詢指定開賽時段入球大細訊號狀態（只讀）

on:
  workflow_dispatch:
    inputs:
      kickoff_min_ms:
        description: "開賽時間下限（epoch ms, UTC）"
        required: true
      kickoff_max_ms:
        description: "開賽時間上限（epoch ms, UTC）"
        required: true

permissions:
  contents: read

concurrency:
  group: inspect-ou-match-radar
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 查詢比賽方向、賠率及規則命中狀態
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KICKOFF_MIN: ${{ github.event.inputs.kickoff_min_ms }}
          KICKOFF_MAX: ${{ github.event.inputs.kickoff_max_ms }}
        run: |
          umask 077
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo KICKOFF_MIN='$KICKOFF_MIN' KICKOFF_MAX='$KICKOFF_MAX' python3 -" <<'PY'
          import json
          import os
          import sqlite3

          lo = int(os.environ["KICKOFF_MIN"])
          hi = int(os.environ["KICKOFF_MAX"])
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          db.execute("BEGIN")

          matches = db.execute(
              """
              SELECT id, league, home_team, away_team, kickoff_utc, status, inplay,
                     home_score, away_score
                FROM matches m
                LEFT JOIN research_results r ON r.match_id = m.id
               WHERE m.kickoff_utc BETWEEN ? AND ?
               ORDER BY kickoff_utc
              """,
              (lo, hi),
          ).fetchall()

          print("=== MATCHES ===")
          for m in matches:
              print(json.dumps(dict(m), ensure_ascii=False))

          for m in matches:
              mid = m["id"]
              print(f"\n=== SNAPSHOTS (OU) for {mid} ({m['home_team']} vs {m['away_team']}) ===")
              rows = db.execute(
                  """
                  SELECT provider, stage, line_key, selection, decimal_odds, is_main, captured_at
                    FROM research_timeline_snapshots
                   WHERE match_id=? AND market='OU'
                   ORDER BY provider, stage, line_key, selection
                  """,
                  (mid,),
              ).fetchall()
              for r in rows:
                  print(json.dumps(dict(r), ensure_ascii=False))

              print(f"\n=== ou_signal_prealerts for {mid} ===")
              for r in db.execute(
                  "SELECT * FROM ou_signal_prealerts WHERE match_id=?", (mid,)
              ).fetchall():
                  print(json.dumps(dict(r), ensure_ascii=False))

              print(f"\n=== ou_signal_observations for {mid} ===")
              for r in db.execute(
                  "SELECT * FROM ou_signal_observations WHERE match_id=?", (mid,)
              ).fetchall():
                  print(json.dumps(dict(r), ensure_ascii=False))

          db.rollback()
          db.close()
          PY

      - name: 查詢收集器紀錄及 Pinnacle 來源 mapping
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          KICKOFF_MIN: ${{ github.event.inputs.kickoff_min_ms }}
          KICKOFF_MAX: ${{ github.event.inputs.kickoff_max_ms }}
        run: |
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<REMOTE
          set -euo pipefail
          cd /opt/odds-radar

          echo "=== collector logs (last 120 minutes) ==="
          sudo docker compose logs --since 120m radar 2>&1 |
            grep -E 'auto_research_timeline|pinnacle_detail|pinnapi|titan|research' |
            tail -600 || true

          echo "=== Pinnacle mappings and checkpoint summary ==="
          sudo KICKOFF_MIN='$KICKOFF_MIN' KICKOFF_MAX='$KICKOFF_MAX' python3 - <<'PY'
          import json
          import os
          import sqlite3

          lo = int(os.environ["KICKOFF_MIN"])
          hi = int(os.environ["KICKOFF_MAX"])
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          rows = db.execute(
              """
              SELECT m.id,m.fixture_source,m.titan_id,m.pinnacle_match_id,
                     m.league,m.home_team,m.away_team,m.kickoff_utc,
                     p.pinnapi_id,p.pinnapi_reversed,p.titan_id map_titan_id,
                     p.titan_reversed,p.active_source
                FROM matches m
                LEFT JOIN pinnacle_source_map p ON p.match_id=m.id
               WHERE m.kickoff_utc BETWEEN ? AND ?
               ORDER BY m.kickoff_utc,m.id
              """,
              (lo, hi),
          ).fetchall()
          for row in rows:
              item = dict(row)
              item["points"] = [
                  dict(x) for x in db.execute(
                      """
                      SELECT stage,target_at,first_captured_at,last_retry_at,status,note
                        FROM research_timeline_points
                       WHERE match_id=? ORDER BY target_at
                      """,
                      (row["id"],),
                  ).fetchall()
              ]
              item["ou_snapshots"] = [
                  dict(x) for x in db.execute(
                      """
                      SELECT provider,stage,COUNT(*) rows,MIN(captured_at) first_at,
                             MAX(captured_at) last_at,
                             GROUP_CONCAT(DISTINCT COALESCE(source_name,'')) source_names,
                             GROUP_CONCAT(DISTINCT COALESCE(source_match_id,'')) source_ids
                        FROM research_timeline_snapshots
                       WHERE match_id=? AND market='OU'
                       GROUP BY provider,stage ORDER BY provider,stage
                      """,
                      (row["id"],),
                  ).fetchall()
              ]
              print(json.dumps(item, ensure_ascii=False))
          db.close()
          PY
          REMOTE
