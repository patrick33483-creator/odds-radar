name: 診斷 pair match 但冇分

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 睇 match 但冇分嘅場
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo python3 -" <<'PY'
          import datetime, sqlite3, time, urllib.request, re
          from collections import defaultdict
          hkt = datetime.timezone(datetime.timedelta(hours=8))
          db = sqlite3.connect("/opt/odds-radar/data/data.db")
          db.row_factory = sqlite3.Row

          now_ms = int(time.time() * 1000)
          cutoff = now_ms - 105 * 60 * 1000
          lo = now_ms - 3 * 24 * 3600 * 1000

          cands = db.execute(
              """SELECT m.id, m.kickoff_utc, m.home_team, m.away_team
                   FROM matches m
                   LEFT JOIN research_results rr ON rr.match_id=m.id
                  WHERE rr.match_id IS NULL AND m.kickoff_utc<=? AND m.kickoff_utc>=?
                    AND m.fixture_source='crown'""",
              (cutoff, lo),
          ).fetchall()

          def strip_tags(s): return re.sub(r"<[^>]+>", "", s or "").strip()

          def parse_page(html):
              rows = []
              row_re = re.compile(r"<tr[^>]*sId=['\"]?(\d+)['\"]?[^>]*>([\s\S]*?)</tr>")
              for m in row_re.finditer(html):
                  raw = re.findall(r"<td[^>]*>[\s\S]*?</td>", m.group(2))
                  if len(raw) < 7: continue
                  cells = [strip_tags(c) for c in raw]
                  home = re.sub(r"\[[^\]]*\]", "", cells[3]).strip()
                  away = re.sub(r"\[[^\]]*\]", "", cells[5]).strip()
                  sc = re.search(r"(\d+)\s*-\s*(\d+)", cells[4])
                  rows.append({
                      "time": cells[1], "home": home, "away": away,
                      "score_txt": cells[4], "sid": m.group(1),
                      "score": (int(sc.group(1)), int(sc.group(2))) if sc else None,
                  })
              return rows

          # Fetch 4 頁
          by_pair = defaultdict(list)
          for day in ("20260902", "20260903", "20260904"):
              for kind in ("Over", "Next"):
                  try:
                      req = urllib.request.Request(
                          f"http://bf.titan007.com/football/{kind}_{day}.htm",
                          headers={"User-Agent":"Mozilla/5.0","Referer":"http://bf.titan007.com/"})
                      html = urllib.request.urlopen(req, timeout=25).read().decode("gb18030","ignore")
                      for r in parse_page(html):
                          r["day"] = day; r["kind"] = kind
                          by_pair[(r["home"], r["away"])].append(r)
                  except Exception as e:
                      print(f"{kind}_{day}: ERR {e}")

          # 攞 15 個 crown candidate 睇喺 titan007 邊
          print("=== Crown cand vs titan007 match 詳情 ===")
          n = 0
          for c in cands:
              opts = by_pair.get((c["home_team"], c["away_team"]))
              if not opts: continue
              day = datetime.datetime.fromtimestamp(c["kickoff_utc"]/1000, tz=hkt).strftime("%m-%d %H:%M")
              print(f"\nCrown [{c['home_team']}] vs [{c['away_team']}]  {day}HKT")
              for r in opts:
                  print(f"  titan {r['kind']}_{r['day']} {r['time']}  sId={r['sid']}  score_txt='{r['score_txt']}'  parsed={r['score']}")
              n += 1
              if n >= 15: break
          db.close()
          PY
