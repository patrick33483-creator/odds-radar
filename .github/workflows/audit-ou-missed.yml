name: 回溯入球大細訊號漏報（只讀副本）

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "回溯自訊號啟動起最多幾多日的比賽（預設 30 日，會自動裁到啟動日）"
        required: false
        default: "30"

permissions:
  contents: read

concurrency:
  group: audit-ou-missed-radar
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安裝依賴
        run: npm ci

      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 從生產串流最新壓縮備份
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          mkdir -p audit-ou-workdir
          SSH_OPTS="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=60 -o TCPKeepAlive=yes"
          # Remove only stale files created by earlier failed audit runs.
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo rm -f /tmp/audit-ou-*.db /tmp/audit-ou-*.db.gz"
          # Reuse an existing compressed deploy/hourly backup; do not create
          # another multi-GB copy on the production host.
          LATEST="$(
            ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
              "sudo find /opt/odds-radar/backups -maxdepth 1 -type f -name '*.sql.gz' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-"
          )"
          test -n "$LATEST"
          echo "Using $(basename "$LATEST")"
          ssh $SSH_OPTS "$DEPLOY_USER@$DEPLOY_HOST" \
            "sudo cat '$LATEST'" > audit-ou-workdir/data.sql.gz
          gzip -t audit-ou-workdir/data.sql.gz
          gunzip -c audit-ou-workdir/data.sql.gz | sqlite3 audit-ou-workdir/data.db
          rm -f audit-ou-workdir/data.sql.gz
          ls -lh audit-ou-workdir/data.db

      - name: 用最新引擎重放 syncOuSignal*（只寫副本）
        env:
          RADAR_DB: ${{ github.workspace }}/audit-ou-workdir/data.db
          LOOKBACK_DAYS: ${{ github.event.inputs.lookback_days }}
        run: |
          # 副本檔案路徑必須包含 "audit-ou-" 才會被 script 接受
          test -f "$RADAR_DB"
          npx tsx scripts/audit-ou-missed.ts

      - name: 清理副本
        if: always()
        run: rm -rf audit-ou-workdir
