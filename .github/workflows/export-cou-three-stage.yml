name: 匯出角球三階段研究資料（只讀）

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-cou-three-stage-radar
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 匯出角球初盤、T-30、T-5 與官方角球賽果
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          umask 077
          ssh -o BatchMode=yes -o ConnectTimeout=20 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'sudo python3 -' > cou-three-stage.jsonl <<'PY'
          import json
          import sqlite3

          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          db.execute("BEGIN")
          sql = r"""
          SELECT m.id AS match_id, m.hkjc_id, m.league, m.home_team,
                 m.away_team, m.kickoff_utc,
                 q.provider, q.stage, q.line_key, q.selection,
                 q.decimal_odds, q.is_main, q.source_updated_at,
                 q.captured_at, q.target_at, q.status AS quote_status,
                 COALESCE(rr.corners_total, r.corners_total) AS corners_total,
                 COALESCE(rr.source, r.source) AS result_source,
                 COALESCE(rr.fetched_at, r.fetched_at) AS result_fetched_at
            FROM research_timeline_snapshots q
            JOIN matches m ON m.id=q.match_id
            LEFT JOIN research_results rr ON rr.match_id=m.id
            LEFT JOIN results r ON r.match_id=m.id
           WHERE q.market='COU'
             AND q.stage IN ('initial','T30','T5')
             AND q.captured_at < m.kickoff_utc
           ORDER BY m.kickoff_utc,m.id,q.provider,q.line_key,q.stage,q.selection
          """
          for row in db.execute(sql):
              print(json.dumps(dict(row), ensure_ascii=False, separators=(",", ":")))
          db.rollback()
          db.close()
          PY
          test -s cou-three-stage.jsonl
          sha256sum cou-three-stage.jsonl > cou-three-stage.sha256
          wc -l cou-three-stage.jsonl

      - name: 上載短期角球研究資料
        uses: actions/upload-artifact@v4
        with:
          name: cou-three-stage-data
          path: |
            cou-three-stage.jsonl
            cou-three-stage.sha256
          retention-days: 1
          if-no-files-found: error
