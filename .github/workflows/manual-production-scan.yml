name: 手動掃描盤路雷達

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀核對全部歷史 EV 注單賠率同步
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/odds-radar
            sudo docker compose --env-file /opt/odds-radar/.env exec -T radar node
          ' <<'NODE'
          const fs = require("fs");
          const Database = require("better-sqlite3");
          const paths = [
            process.env.RADAR_DB,
            "data.db",
            "/app/data.db",
            "/app/data/data.db",
            "/data/data.db",
          ].filter(Boolean);
          const dbPath = paths.find(path => fs.existsSync(path));
          if (!dbPath) throw new Error(`RADAR_DB_NOT_FOUND candidates=${paths.join(",")}`);
          const db = new Database(dbPath, { readonly: true, fileMustExist: true });
          const MAX_AGE_MS = 90_000;
          const MAX_SKEW_MS = 30_000;
          const selectionsFor = market =>
            market === "1X2" ? ["H", "D", "A"] :
            market === "AH" ? ["H", "A"] : ["O", "U"];
          const bets = db.prepare(`
            SELECT b.*, l.provider AS leg_provider, l.decimal_odds AS leg_odds
            FROM simulation_bets b
            LEFT JOIN simulation_legs l
              ON l.bet_id = b.id
             AND l.provider = 'hkjc'
             AND l.market = b.market
             AND l.line_key = b.line_key
             AND l.selection = b.selection
            WHERE b.category = 'case2_ev'
            ORDER BY b.placed_at, b.id
          `).all();
          const latestSnapshot = db.prepare(`
            SELECT decimal_odds, fetched_at, source_updated_at
            FROM odds_snapshots
            WHERE match_id = ?
              AND provider = ?
              AND market = ?
              AND line_key = ?
              AND selection = ?
              AND fetched_at <= ?
            ORDER BY fetched_at DESC, id DESC
            LIMIT 1
          `);
          const results = [];
          for (const bet of bets) {
            const selections = selectionsFor(bet.market);
            const hkjc = latestSnapshot.get(
              bet.match_id, "hkjc", bet.market, bet.line_key, bet.selection, bet.placed_at
            );
            const pinnacle = selections.map(selection => ({
              selection,
              row: latestSnapshot.get(
                bet.match_id, "pinnacle", bet.market, bet.line_key, selection, bet.placed_at
              ),
            }));
            const missing = [];
            if (!hkjc) missing.push("hkjc_execution_quote");
            for (const item of pinnacle) {
              if (!item.row) missing.push(`pinnacle_${item.selection}`);
            }
            let maxAgeMs = null;
            let skewMs = null;
            let recomputedEv = null;
            let synchronized = false;
            if (!missing.length) {
              const timestamps = [hkjc.fetched_at, ...pinnacle.map(item => item.row.fetched_at)];
              const ages = timestamps.map(timestamp => bet.placed_at - timestamp);
              maxAgeMs = Math.max(...ages);
              skewMs = Math.max(...timestamps) - Math.min(...timestamps);
              const inverse = pinnacle.map(item => 1 / item.row.decimal_odds);
              const total = inverse.reduce((a, b) => a + b, 0);
              const index = selections.indexOf(bet.selection);
              const probability = inverse[index] / total;
              recomputedEv = probability * hkjc.decimal_odds - 1;
              synchronized =
                ages.every(age => age >= 0 && age <= MAX_AGE_MS)
                && skewMs <= MAX_SKEW_MS;
            }
            results.push({
              bet_id: bet.id,
              match_id: bet.match_id,
              match: bet.match_label,
              league: bet.league,
              kickoff_utc: new Date(bet.kickoff_utc).toISOString(),
              placed_at_utc: new Date(bet.placed_at).toISOString(),
              market: bet.market,
              line_key: bet.line_key,
              selection: bet.selection,
              stored_hkjc_odds: bet.leg_odds,
              stored_ev: bet.ev_pct,
              evidence_hkjc_odds: hkjc?.decimal_odds ?? null,
              evidence_pinnacle_odds: Object.fromEntries(
                pinnacle.map(item => [item.selection, item.row?.decimal_odds ?? null])
              ),
              max_quote_age_seconds: maxAgeMs === null ? null : Math.round(maxAgeMs / 1000),
              quote_skew_seconds: skewMs === null ? null : Math.round(skewMs / 1000),
              recomputed_ev: recomputedEv === null
                ? null : Math.round(recomputedEv * 1e6) / 1e6,
              ev_difference: recomputedEv === null || bet.ev_pct === null
                ? null : Math.round((recomputedEv - bet.ev_pct) * 1e6) / 1e6,
              missing,
              synchronized,
            });
          }
          const complete = results.filter(row => row.missing.length === 0);
          const synchronized = complete.filter(row => row.synchronized);
          const result = {
            schema: "radar-historical-ev-sync-audit-v1",
            audit_only: true,
            provider_calls: 0,
            writes: 0,
            now_utc: new Date().toISOString(),
            thresholds: {
              max_quote_age_seconds: MAX_AGE_MS / 1000,
              max_quote_skew_seconds: MAX_SKEW_MS / 1000,
            },
            total_historical_ev_bets: results.length,
            complete_quote_evidence: complete.length,
            missing_quote_evidence: results.length - complete.length,
            synchronized_bets: synchronized.length,
            unsynchronized_bets: complete.length - synchronized.length,
            all_complete_bets_synchronized: complete.every(row => row.synchronized),
            max_quote_age_seconds: synchronized.length
              ? Math.max(...synchronized.map(row => row.max_quote_age_seconds)) : null,
            max_quote_skew_seconds: synchronized.length
              ? Math.max(...synchronized.map(row => row.quote_skew_seconds)) : null,
            evidence_missing_rows: results.filter(row => row.missing.length > 0),
            unsynchronized_rows: complete.filter(row => !row.synchronized),
            synchronized_rows: synchronized,
          };
          console.log(JSON.stringify(result));
          db.close();
          NODE
