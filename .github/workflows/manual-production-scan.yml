name: 皇冠賽事日期分佈（只讀）

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 統計每日皇冠賽事及初盤覆蓋
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' <<'PY'
          import sqlite3, time
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          rows = db.execute(
              """
              SELECT strftime('%Y-%m-%d', datetime(kickoff_utc/1000, 'unixepoch', '+8 hours')) day,
                     fixture_source,
                     COUNT(*) total,
                     SUM(CASE WHEN EXISTS(
                       SELECT 1 FROM research_timeline_snapshots s
                        WHERE s.match_id=m.id AND s.provider='crown' AND s.stage='initial'
                        GROUP BY s.match_id HAVING COUNT(DISTINCT s.market)>=2
                     ) THEN 1 ELSE 0 END) opening_ok
                FROM matches m
               WHERE kickoff_utc>=?
               GROUP BY day, fixture_source
               ORDER BY day, fixture_source
              """,
              (int(time.time() * 1000),),
          ).fetchall()
          for row in rows:
              print("DAY|" + "|".join(str(x) for x in row))
          span = db.execute(
              "SELECT MIN(kickoff_utc), MAX(kickoff_utc) FROM matches WHERE fixture_source='crown'"
          ).fetchone()
          print(f"CROWN_MIN={span[0]}\nCROWN_MAX={span[1]}")
          PY
