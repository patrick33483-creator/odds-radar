name: OU 訊號 Production 健康檢查（只讀）

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 查 OU 訊號表、候選及日誌
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' <<'PY'
          import sqlite3, json, time, datetime
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          now = int(time.time() * 1000)
          hkt = datetime.timezone(datetime.timedelta(hours=8))
          start = int(datetime.datetime.now(hkt).replace(hour=0, minute=0, second=0, microsecond=0).timestamp()*1000)
          print(f"NOW={now} DAY_START={start}")

          for table in ["ou_signal_prealerts","ou_signal_observations","odds_latest","odds_snapshots","opportunities"]:
              cols = [r["name"] for r in db.execute(f"PRAGMA table_info({table})")]
              print("SCHEMA|" + table + "|" + ",".join(cols))
              time_col = next((c for c in ["created_at","observed_at","captured_at","updated_at","detected_at"] if c in cols), None)
              if time_col:
                  row = db.execute(f"SELECT COUNT(*) n, MAX({time_col}) latest FROM {table} WHERE {time_col}>=?", (start,)).fetchone()
              else:
                  row = db.execute(f"SELECT COUNT(*) n FROM {table}").fetchone()
              print("COUNT|" + table + "|" + json.dumps(dict(row), ensure_ascii=False))

          # 最近 10 筆 prealert / observation
          for table in ["ou_signal_prealerts","ou_signal_observations"]:
              cols = [r["name"] for r in db.execute(f"PRAGMA table_info({table})")]
              order = next((c for c in ["created_at","observed_at","captured_at","updated_at","detected_at","id"] if c in cols), "rowid")
              selected = [c for c in ["id","match_id","stage","status","signal","direction","reason","created_at","observed_at","updated_at"] if c in cols]
              rows = db.execute(f"SELECT {','.join(selected)} FROM {table} ORDER BY {order} DESC LIMIT 10").fetchall()
              for r in rows:
                  print("ROW|" + table + "|" + json.dumps(dict(r), ensure_ascii=False, default=str))

          print("=== UPCOMING HKJC MATCHES ===")
          rows = db.execute("""
            SELECT id,league,home_team,away_team,kickoff_utc,
                   (SELECT COUNT(*) FROM odds_latest o WHERE o.match_id=m.id AND o.market='OU') ou_latest,
                   (SELECT MAX(fetched_at) FROM odds_latest o WHERE o.match_id=m.id AND o.market='OU') last_ou
              FROM matches m
             WHERE m.fixture_source='hkjc' AND m.kickoff_utc>=?
             ORDER BY m.kickoff_utc LIMIT 20
          """, (now,)).fetchall()
          print("UPCOMING_COUNT|" + str(db.execute(
            "SELECT COUNT(*) FROM matches WHERE fixture_source='hkjc' AND kickoff_utc>=?", (now,)
          ).fetchone()[0]))
          for r in rows:
              print("UPCOMING|" + json.dumps(dict(r), ensure_ascii=False))

          print("=== STATE ===")
          for r in db.execute("""
            SELECT key,value,updated_at FROM state
             WHERE key LIKE '%scan%' OR key LIKE '%telegram%' OR key LIKE '%signal%'
             ORDER BY updated_at DESC LIMIT 50
          """):
              print("STATE|" + json.dumps(dict(r), ensure_ascii=False, default=str))
          PY

          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            cd /opt/odds-radar
            sudo docker compose logs --since 24h radar 2>&1 |
              grep -Ei "ou_signal|prealert|telegram|signal.*error|scan.*error" |
              tail -n 250
          ' || true
