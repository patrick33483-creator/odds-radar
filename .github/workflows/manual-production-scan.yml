name: 手動掃描盤路雷達

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: odds-radar-corner-ev-funnel-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 只讀查核 provider_health 及最新報價時間（補充證據）
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/odds-radar
            sudo docker compose --env-file /opt/odds-radar/.env exec -T radar node
          ' <<'NODE'
          const fs = require("fs");
          const Database = require("better-sqlite3");
          const paths = [process.env.RADAR_DB, "data.db", "/app/data.db", "/app/data/data.db", "/data/data.db"].filter(Boolean);
          const dbPath = paths.find((p) => fs.existsSync(p));
          if (!dbPath) throw new Error("RADAR_DB_NOT_FOUND");
          const db = new Database(dbPath, { readonly: true, fileMustExist: true });
          const now = Date.now();
          const health = db.prepare("SELECT * FROM provider_health").all();
          const withAge = health.map(h => ({...h, last_success_age_sec: h.last_success_at ? Math.round((now - h.last_success_at)/1000) : null, last_attempt_age_sec: h.last_attempt_at ? Math.round((now - h.last_attempt_at)/1000) : null}));
          const recentSnapCount = db.prepare("SELECT provider, COUNT(*) as n, MAX(fetched_at) as maxFetched FROM odds_snapshots WHERE fetched_at > ? GROUP BY provider").get ? db.prepare("SELECT provider, COUNT(*) as n, MAX(fetched_at) as maxFetched FROM odds_snapshots WHERE fetched_at > ? GROUP BY provider").all(now - 3600000) : [];
          const latestFetchByProvider = db.prepare("SELECT provider, MAX(fetched_at) as maxFetched, COUNT(*) as n FROM odds_latest GROUP BY provider").all();
          console.log(JSON.stringify({
            schema: "corner-ev-funnel-audit-supplement-health-v1",
            audit_only: true, provider_calls: 0, writes: 0,
            now_utc: new Date(now).toISOString(),
            provider_health: withAge,
            recent_1h_snapshot_counts: recentSnapCount,
            latest_fetch_by_provider_in_odds_latest: latestFetchByProvider.map(r => ({...r, age_sec: r.maxFetched ? Math.round((now - r.maxFetched)/1000) : null})),
          }));
          db.close();

          NODE
