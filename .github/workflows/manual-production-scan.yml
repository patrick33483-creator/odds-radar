name: 手動掃描盤路雷達

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 唯讀核對皇冠賠率新鮮度
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set +e
          output="$(ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/odds-radar
            docker compose exec -T radar node
          ' 2>&1 <<'NODE'
          const fs = require("fs");
          const Database = require("better-sqlite3");
          const candidates = [
            process.env.RADAR_DB,
            "data.db",
            "/app/data.db",
            "/app/data/data.db",
            "/data/data.db",
          ].filter(Boolean);
          const path = candidates.find(candidate => fs.existsSync(candidate));
          if (!path) {
            throw new Error(`RADAR_DB_NOT_FOUND candidates=${candidates.join(",")}`);
          }
          const db = new Database(path, { readonly: true, fileMustExist: true });
          const now = Date.now();
          const futureCutoff = now + 24 * 60 * 60 * 1000;
          const rows = db.prepare(`
            SELECT
              m.id AS match_id,
              m.kickoff_utc,
              COUNT(o.key) AS crown_rows,
              MAX(o.fetched_at) AS latest_fetched_at,
              MAX(o.source_updated_at) AS latest_source_updated_at
            FROM matches m
            LEFT JOIN odds_latest o
              ON o.match_id = m.id AND o.provider = 'crown'
            WHERE m.kickoff_utc > ? AND m.kickoff_utc <= ?
            GROUP BY m.id, m.kickoff_utc
            ORDER BY m.kickoff_utc, m.id
          `).all(now, futureCutoff);
          const ages = rows
            .filter(r => Number.isFinite(r.latest_fetched_at))
            .map(r => Math.max(0, (now - r.latest_fetched_at) / 1000));
          const sorted = [...ages].sort((a, b) => a - b);
          const percentile = p => sorted.length
            ? sorted[Math.min(sorted.length - 1, Math.floor((sorted.length - 1) * p))]
            : null;
          const bucket = max => ages.filter(x => x <= max).length;
          const result = {
            schema: "radar-crown-freshness-audit-v1",
            audit_only: true,
            provider_calls: 0,
            writes: 0,
            now_utc: new Date(now).toISOString(),
            future_24h_matches: rows.length,
            matches_with_crown_rows: rows.filter(r => r.crown_rows > 0).length,
            matches_without_crown_rows: rows.filter(r => r.crown_rows === 0).length,
            latest_crown_fetched_at_utc: rows.some(r => r.latest_fetched_at)
              ? new Date(Math.max(...rows.filter(r => r.latest_fetched_at).map(r => r.latest_fetched_at))).toISOString()
              : null,
            fetched_age_seconds: {
              min: sorted.length ? sorted[0] : null,
              median: percentile(0.5),
              p90: percentile(0.9),
              max: sorted.length ? sorted[sorted.length - 1] : null,
            },
            freshness_counts: {
              within_60s: bucket(60),
              within_5m: bucket(300),
              within_15m: bucket(900),
              older_than_15m: ages.filter(x => x > 900).length,
            },
            next_3h: rows
              .filter(r => r.kickoff_utc <= now + 3 * 60 * 60 * 1000)
              .map(r => ({
                match_id: r.match_id,
                kickoff_utc: new Date(r.kickoff_utc).toISOString(),
                crown_rows: r.crown_rows,
                latest_fetched_at_utc: r.latest_fetched_at
                  ? new Date(r.latest_fetched_at).toISOString()
                  : null,
                fetched_age_seconds: r.latest_fetched_at
                  ? Math.max(0, Math.round((now - r.latest_fetched_at) / 1000))
                  : null,
                latest_source_updated_at_utc: r.latest_source_updated_at
                  ? new Date(r.latest_source_updated_at).toISOString()
                  : null,
              })),
          };
          console.log(JSON.stringify(result));
          db.close();
          NODE
          )"
          rc=$?
          set -e
          {
            echo '## Crown odds freshness audit'
            echo
            echo '```json'
            printf '%s\n' "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$output"
          exit "$rc"
