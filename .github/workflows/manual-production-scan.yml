name: 手動掃描盤路雷達

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 執行一次賽前窗口掃描
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo bash -s' <<'REMOTE'
            set -e
            cd /opt/odds-radar
            set -a
            . ./.env
            set +a
            test -n "${RADAR_ACCESS_USER:-}" -a -n "${RADAR_ACCESS_PASSWORD:-}"
            echo "commit=$(git rev-parse HEAD)"
            echo "RADAR_HKJC_ONLY=$(docker compose exec -T radar printenv RADAR_HKJC_ONLY </dev/null)"
            docker compose ps
            curl --fail --silent --show-error \
              --max-time 30 \
              --user "$RADAR_ACCESS_USER:$RADAR_ACCESS_PASSWORD" \
              http://127.0.0.1:5001/api/scan/window
            echo
            python3 - <<'PY'
          import json, sqlite3, time
          now = int(time.time() * 1000)
          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row
          fixtures = db.execute("""
            SELECT m.id,m.home_team,m.away_team,m.kickoff_utc,
                   p.pinnapi_id,p.titan_id,p.active_source
              FROM matches m
              LEFT JOIN pinnacle_source_map p ON p.match_id=m.id
             WHERE m.fixture_source='hkjc'
               AND m.kickoff_utc>? AND m.kickoff_utc<=?
             ORDER BY m.kickoff_utc,m.id
          """, (now - 5 * 60_000, now + 60 * 60_000)).fetchall()
          ids = [row["id"] for row in fixtures]
          snapshots = []
          if ids:
            marks = ",".join("?" for _ in ids)
            snapshots = db.execute(f"""
              SELECT match_id,stage,provider,market,COUNT(*) rows,
                     MAX(captured_at) captured_at
                FROM research_timeline_snapshots
               WHERE match_id IN ({marks})
                 AND stage IN ('initial','T30','T15','T5')
               GROUP BY match_id,stage,provider,market
               ORDER BY match_id,stage,provider,market
            """, ids).fetchall()
          print(json.dumps({
            "checked_at": now,
            "upcoming_hkjc": [dict(row) for row in fixtures],
            "snapshots": [dict(row) for row in snapshots],
          }, ensure_ascii=False))
          db.close()
          PY
          REMOTE
