name: diag-dashboard
on: workflow_dispatch
jobs:
  d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          cat > /tmp/diag.py <<'PYEOF'
          import datetime, sqlite3, time
          db = sqlite3.connect("/opt/odds-radar/data/data.db", timeout=30)
          db.row_factory = sqlite3.Row
          now_ms = int(time.time()*1000)
          q1 = db.execute("""
            SELECT m.fixture_source,
                   SUM(CASE WHEN r.match_id IS NULL AND m.kickoff_utc<=? THEN 1 ELSE 0 END) awaiting,
                   SUM(CASE WHEN r.match_id IS NOT NULL THEN 1 ELSE 0 END) settled,
                   COUNT(*) total
              FROM ou_signal_observations o
              JOIN matches m ON m.id=o.match_id
              LEFT JOIN research_results r ON r.match_id=o.match_id
             GROUP BY m.fixture_source
          """,(now_ms,)).fetchall()
          print("== dashboard by source ==")
          total_awaiting = 0
          for r in q1:
              print(f"  {r['fixture_source']:10s} awaiting={r['awaiting']} settled={r['settled']} total={r['total']}")
              total_awaiting += r['awaiting']
          print(f"== TOTAL awaiting = {total_awaiting} ==")
          PYEOF
          scp /tmp/diag.py "$DEPLOY_USER@$DEPLOY_HOST:/tmp/diag.py"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo -E python3 /tmp/diag.py'
