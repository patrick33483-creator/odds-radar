name: 手動結算 + 診斷待賽果

on:
  workflow_dispatch:

jobs:
  settle-and-diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: 設定 SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: 診斷 research_results 表覆蓋率
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" 'sudo python3 -' <<'PY'
          import datetime
          import json
          import sqlite3
          import time

          now_ms = int(time.time() * 1000)
          cutoff = now_ms - 105 * 60 * 1000
          hkt = datetime.timezone(datetime.timedelta(hours=8))

          db = sqlite3.connect("file:/opt/odds-radar/data/data.db?mode=ro", uri=True)
          db.row_factory = sqlite3.Row

          def fmt(ms):
              if not ms:
                  return None
              return datetime.datetime.fromtimestamp(ms / 1000, tz=hkt).strftime("%Y-%m-%d %H:%M")

          out = {"observed_at_hkt": datetime.datetime.now(hkt).strftime("%Y-%m-%d %H:%M:%S")}

          # research_results 全表狀況
          out["research_results_total"] = db.execute(
              "SELECT COUNT(*) c FROM research_results"
          ).fetchone()["c"]
          latest = db.execute("SELECT MAX(fetched_at) f FROM research_results").fetchone()["f"]
          out["research_results_latest_fetched_hkt"] = fmt(latest)
          if latest:
              out["research_results_lag_hours"] = round((now_ms - latest) / 3600000, 2)

          # 過去 7 日 matches 覆蓋率（跌落 research_results 個 rr）
          for days, label in [(1, "24h"), (3, "3d"), (7, "7d")]:
              lo = now_ms - days * 24 * 3600 * 1000
              total = db.execute(
                  "SELECT COUNT(*) c FROM matches WHERE kickoff_utc BETWEEN ? AND ?",
                  (lo, cutoff),
              ).fetchone()["c"]
              covered = db.execute(
                  """SELECT COUNT(*) c FROM matches m
                     WHERE m.kickoff_utc BETWEEN ? AND ?
                       AND EXISTS(SELECT 1 FROM research_results rr WHERE rr.match_id = m.id)""",
                  (lo, cutoff),
              ).fetchone()["c"]
              out[f"past_{label}"] = {
                  "matches": total,
                  "with_research_result": covered,
                  "coverage_pct": round(covered * 100 / max(total, 1), 1),
              }

          # research 相關 state（timer 有無 run、有無 error）
          try:
              state_rows = db.execute(
                  """SELECT k, v FROM states
                     WHERE k IN (
                       'researchResultsLastRunAt',
                       'researchResultsLastSuccessAt',
                       'researchResultsLastError',
                       'researchResultsLastCollected'
                     )"""
              ).fetchall()
              state = {r["k"]: r["v"] for r in state_rows}
              out["research_state"] = {
                  "last_run_hkt": fmt(int(state.get("researchResultsLastRunAt", "0") or 0)),
                  "last_success_hkt": fmt(int(state.get("researchResultsLastSuccessAt", "0") or 0)),
                  "last_error": state.get("researchResultsLastError", ""),
                  "last_collected": state.get("researchResultsLastCollected", ""),
              }
          except Exception as e:
              out["research_state_error"] = str(e)

          # 樣本：抽 10 場最近開但冇 research_result（睇 hkjc_id 有無）
          missing = db.execute(
              """SELECT m.id, m.home_team, m.away_team, m.kickoff_utc,
                        m.fixture_source, m.hkjc_id, m.titan_id, m.pinnacle_match_id
                 FROM matches m
                 WHERE m.kickoff_utc <= ?
                   AND m.kickoff_utc >= ?
                   AND NOT EXISTS(SELECT 1 FROM research_results rr WHERE rr.match_id = m.id)
                 ORDER BY m.kickoff_utc DESC
                 LIMIT 10""",
              (cutoff, now_ms - 7 * 24 * 3600 * 1000),
          ).fetchall()
          out["sample_missing"] = []
          for r in missing:
              d = dict(r)
              d["kickoff_hkt"] = fmt(d["kickoff_utc"])
              d["age_hours"] = round((now_ms - d["kickoff_utc"]) / 3600000, 2)
              del d["kickoff_utc"]
              out["sample_missing"].append(d)

          # 有 hkjc_id 但冇 research_result 嘅場（呢啲應該 collect 到）
          out["past_7d_with_hkjc_id_no_result"] = db.execute(
              """SELECT COUNT(*) c FROM matches m
                 WHERE m.kickoff_utc BETWEEN ? AND ?
                   AND m.hkjc_id IS NOT NULL AND m.hkjc_id != ''
                   AND NOT EXISTS(SELECT 1 FROM research_results rr WHERE rr.match_id = m.id)""",
              (now_ms - 7 * 24 * 3600 * 1000, cutoff),
          ).fetchone()["c"]

          print(json.dumps(out, indent=2, ensure_ascii=False))
          db.close()
          PY

      - name: 檢查 container 有無 restart / research timer log
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" '
            set -e
            cd /opt/odds-radar
            echo "=== container status ==="
            sudo docker compose ps
            echo ""
            echo "=== 最近 research_results log（可能 4 日前）==="
            sudo docker compose logs --since 168h app 2>&1 | grep -E "research_results|research_results_error" | tail -20
          '
